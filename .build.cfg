BUILD_LINUX=true
# Sourced by go-build-release after its defaults. The release binary is
# cephfs-indexd, which links librados through cgo: build on a host with
# librados-devel. It needs only librados.so.2 and glibc >= 2.34 at runtime,
# so a build from an EL9/EL10 host also runs on Debian 12.
MAIN_PACKAGE=./cmd/cephfs-indexd
export CGO_ENABLED=1
# Name the assets after the repo, not the checkout directory.
PROJECTNAME=cephfs-index
